<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurassic Rampage - Complete Arcade Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #08080c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 100, 0, 0.2);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #2a2a35;
        }
        canvas {
            display: block;
            background: #000;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }
        .hud-card {
            background: rgba(10, 10, 15, 0.75);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 14px;
            border-radius: 6px;
            min-width: 220px;
        }
        .bar-container {
            width: 100%;
            height: 16px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #444;
            border-radius: 3px;
            padding: 2px;
            margin-top: 4px;
            position: relative;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.1s linear;
        }
        #player-health { background: linear-gradient(90deg, #ff5252, #4caf50); }
        #boss-health { background: linear-gradient(90deg, #ff9800, #f44336); width: 100%; }
        .boss-hud {
            width: 45%;
            margin: 0 auto;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .boss-hud.active {
            opacity: 1;
        }
        .boss-title {
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff5722;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }
        #level-title {
            font-size: 14px;
            color: #ffca28;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        #controls-hint {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            letter-spacing: 1px;
            border: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
    <div id="ui-overlay">
        <div class="hud-top">
            <div class="hud-card">
                <div style="font-size: 11px; font-weight: bold; color: #aaa; letter-spacing: 1px;">HUNTER STATUS</div>
                <div class="bar-container">
                    <div id="player-health" class="bar-fill" style="width: 100%;"></div>
                </div>
                <div id="level-title" style="margin-top: 6px;">Level 11: Amber Ridge & The Glass Peaks</div>
            </div>
            
            <div id="boss-hud" class="boss-hud hud-card">
                <div id="boss-name" class="boss-title">AMBER-CLAWED THERIZINOSAURUS</div>
                <div class="bar-container">
                    <div id="boss-health" class="bar-fill"></div>
                </div>
            </div>
        </div>
        <div id="controls-hint">A / D: Move &nbsp;|&nbsp; W / Space: Jump &nbsp;|&nbsp; Left Click: Attack</div>
    </div>
</div>

<script>
/**
 * Jurassic Rampage - Levels 11 to 15 Engine
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GRAVITY = 0.55;
const CANVAS_WIDTH = canvas.width;
const CANVAS_HEIGHT = canvas.height;

// Input State
const keys = { a: false, d: false, w: false, space: false, attack: false };

window.addEventListener('keydown', (e) => {
    if (e.key === 'a' || e.key === 'A') keys.a = true;
    if (e.key === 'd' || e.key === 'D') keys.d = true;
    if (e.key === 'w' || e.key === 'W') keys.w = true;
    if (e.key === ' ') keys.space = true;
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'a' || e.key === 'A') keys.a = false;
    if (e.key === 'd' || e.key === 'D') keys.d = false;
    if (e.key === 'w' || e.key === 'W') keys.w = false;
    if (e.key === ' ') keys.space = false;
});

canvas.addEventListener('mousedown', (e) => {
    if (e.button === 0) keys.attack = true;
});

canvas.addEventListener('mouseup', (e) => {
    if (e.button === 0) keys.attack = false;
});

// Level Configurations
const LEVELS = [
    {
        id: 11,
        name: "Level 11: Amber Ridge & Glass Peaks",
        bgTop: "#1c1200",
        bgBottom: "#4d3000",
        accent: "#ffb300",
        bossName: "Amber-Clawed Therizinosaurus",
        bossColor: "#ff8f00",
        hazardType: "amber_shard",
        envParticles: "#ffc107"
    },
    {
        id: 12,
        name: "Level 12: Ash & Sulphur Tar Pits",
        bgTop: "#0f0808",
        bgBottom: "#2d1508",
        accent: "#ff3d00",
        bossName: "Magma-Bred Ankylosaurus",
        bossColor: "#d84315",
        hazardType: "tar_bubble",
        envParticles: "#ff5722"
    },
    {
        id: 13,
        name: "Level 13: Titan Redwood Canopy",
        bgTop: "#0a1128",
        bgBottom: "#1c2541",
        accent: "#00e676",
        bossName: "Tempest Quetzalcoatlus",
        bossColor: "#0288d1",
        hazardType: "wind_gust",
        envParticles: "#80d8ff"
    },
    {
        id: 14,
        name: "Level 14: Abyssal Cenote",
        bgTop: "#02010a",
        bgBottom: "#041f3d",
        accent: "#00f5d4",
        bossName: "Depth-Crawler Mosasaurus",
        bossColor: "#0096c7",
        hazardType: "spore",
        envParticles: "#70e000"
    },
    {
        id: 15,
        name: "Level 15: The Supervolcano Caldera",
        bgTop: "#2b0000",
        bgBottom: "#660000",
        accent: "#ff1744",
        bossName: "Apex Shadow Tyranus",
        bossColor: "#212121",
        hazardType: "falling_rock",
        envParticles: "#ff1744"
    }
];

let currentLevelIdx = 0;
let ambientParticles = [];

// Player Entity
class Player {
    constructor() {
        this.x = 100;
        this.y = 300;
        this.width = 34;
        this.height = 52;
        this.vx = 0;
        this.vy = 0;
        this.speed = 5.5;
        this.jumpStrength = -12.5;
        this.grounded = false;
        this.hp = 100;
        this.maxHp = 100;
        this.isAttacking = false;
        this.attackCooldown = 0;
        this.attackBox = { x: 0, y: 0, width: 50, height: 52 };
        this.facing = 'right';
    }

    update() {
        if (keys.a) {
            this.vx = -this.speed;
            this.facing = 'left';
        } else if (keys.d) {
            this.vx = this.speed;
            this.facing = 'right';
        } else {
            this.vx *= 0.8;
        }

        if ((keys.w || keys.space) && this.grounded) {
            this.vy = this.jumpStrength;
            this.grounded = false;
        }

        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;

        // Ground collision
        if (this.y + this.height >= CANVAS_HEIGHT - 60) {
            this.y = CANVAS_HEIGHT - 60 - this.height;
            this.vy = 0;
            this.grounded = true;
        }

        // Boundaries
        if (this.x < 0) this.x = 0;
        if (this.x + this.width > CANVAS_WIDTH) this.x = CANVAS_WIDTH - this.width;

        // Attack Logic
        if (this.attackCooldown > 0) this.attackCooldown--;

        if (keys.attack && this.attackCooldown === 0) {
            this.isAttacking = true;
            this.attackCooldown = 18;
            setTimeout(() => { this.isAttacking = false; }, 140);
        }

        this.attackBox.x = this.facing === 'right' ? this.x + this.width : this.x - this.attackBox.width;
        this.attackBox.y = this.y;
    }

    draw() {
        // Player Body
        ctx.fillStyle = "#4caf50";
        ctx.fillRect(this.x, this.y, this.width, this.height);

        // Armor accents
        ctx.fillStyle = "#2e7d32";
        ctx.fillRect(this.x + 4, this.y + 12, this.width - 8, this.height - 24);

        // Eyes/Visor
        ctx.fillStyle = "#ffffff";
        const eyeX = this.facing === 'right' ? this.x + 22 : this.x + 4;
        ctx.fillRect(eyeX, this.y + 10, 8, 6);

        // Weapon Attack Slash
        if (this.isAttacking) {
            ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
            ctx.fillRect(this.attackBox.x, this.attackBox.y, this.attackBox.width, this.attackBox.height);
        }
    }
}

// Boss Entity
class Boss {
    constructor(config) {
        this.x = CANVAS_WIDTH - 200;
        this.y = CANVAS_HEIGHT - 220;
        this.width = 140;
        this.height = 160;
        this.hp = 600;
        this.maxHp = 600;
        this.color = config.bossColor;
        this.name = config.bossName;
        this.phase = 1;
        this.attackTimer = 0;
        this.vx = 0;
    }

    update(player) {
        this.attackTimer++;

        // Phase 2 Enrage Transition at 50% HP
        if (this.hp < this.maxHp * 0.5 && this.phase === 1) {
            this.phase = 2;
        }

        // AI Attack Loop
        const attackInterval = this.phase === 2 ? 80 : 120;
        if (this.attackTimer % attackInterval === 0) {
            this.executePattern(player);
        }

        this.x += this.vx;
        this.vx *= 0.88;

        if (this.x < 320) this.x = 320;
        if (this.x + this.width > CANVAS_WIDTH - 20) this.x = CANVAS_WIDTH - 20 - this.width;
    }

    executePattern(player) {
        const rand = Math.random();
        if (rand < 0.5) {
            // Lunge / Charge attack
            const dir = player.x < this.x ? -1 : 1;
            this.vx = dir * (this.phase === 2 ? 14 : 9);
        } else {
            // Spawn hazard projectiles
            spawnHazard(this.x + this.width / 2, this.y + 20);
            if (this.phase === 2) {
                spawnHazard(this.x, this.y + 20);
            }
        }
    }

    draw() {
        // Base Body
        ctx.fillStyle = this.phase === 2 ? "#d50000" : this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);

        // Spikes / Claws Visual Detail
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(this.x - 10, this.y + 40, 15, 8);
        ctx.fillRect(this.x - 10, this.y + 70, 15, 8);

        // Eyes
        ctx.fillStyle = this.phase === 2 ? "#ffff00" : "#ff5252";
        ctx.fillRect(this.x + 20, this.y + 25, 18, 14);

        // Phase 2 Aura
        if (this.phase === 2) {
            ctx.strokeStyle = "rgba(255, 23, 68, 0.6)";
            ctx.lineWidth = 6;
            ctx.strokeRect(this.x - 6, this.y - 6, this.width + 12, this.height + 12);
        }
    }
}

// Environmental Hazards
class Hazard {
    constructor(x, y, type, color) {
        this.x = x;
        this.y = y;
        this.radius = 14;
        this.vx = (Math.random() - 0.5) * 7;
        this.vy = -7;
        this.color = color;
        this.type = type;
        this.active = true;
    }

    update() {
        this.vy += GRAVITY * 0.45;
        this.x += this.vx;
        this.y += this.vy;

        if (this.y >= CANVAS_HEIGHT - 60) {
            this.active = false;
        }
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.closePath();
    }
}

// Global Objects
const player = new Player();
let currentLevelConfig = LEVELS[currentLevelIdx];
let boss = new Boss(currentLevelConfig);
let hazards = [];

function spawnHazard(x, y) {
    hazards.push(new Hazard(x, y, currentLevelConfig.hazardType, currentLevelConfig.accent));
}

function initAmbientParticles() {
    ambientParticles = [];
    for (let i = 0; i < 35; i++) {
        ambientParticles.push({
            x: Math.random() * CANVAS_WIDTH,
            y: Math.random() * CANVAS_HEIGHT,
            size: Math.random() * 3 + 1,
            speedY: -(Math.random() * 1.5 + 0.5),
            opacity: Math.random()
        });
    }
}

function loadLevel(index) {
    currentLevelIdx = index;
    currentLevelConfig = LEVELS[currentLevelIdx];

    document.getElementById('level-title').innerText = currentLevelConfig.name;
    document.getElementById('boss-name').innerText = currentLevelConfig.bossName;
    document.getElementById('boss-hud').classList.add('active');

    boss = new Boss(currentLevelConfig);
    hazards = [];
    player.x = 100;
    initAmbientParticles();
}

// AABB Collision Detection
function checkAABB(rect1, rect2) {
    return (
        rect1.x < rect2.x + rect2.width &&
        rect1.x + rect1.width > rect2.x &&
        rect1.y < rect2.y + rect2.height &&
        rect1.y + rect1.height > rect2.y
    );
}

function checkCircleRect(circle, rect) {
    let distX = Math.abs(circle.x - rect.x - rect.width / 2);
    let distY = Math.abs(circle.y - rect.y - rect.height / 2);

    if (distX > (rect.width / 2 + circle.radius)) return false;
    if (distY > (rect.height / 2 + circle.radius)) return false;

    if (distX <= (rect.width / 2)) return true;
    if (distY <= (rect.height / 2)) return true;

    let dx = distX - rect.width / 2;
    let dy = distY - rect.height / 2;
    return (dx * dx + dy * dy <= (circle.radius * circle.radius));
}

function renderEnvironment() {
    // Dynamic Gradient Background
    let gradient = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
    gradient.addColorStop(0, currentLevelConfig.bgTop);
    gradient.addColorStop(1, currentLevelConfig.bgBottom);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // Ambient Floating Particles
    ctx.fillStyle = currentLevelConfig.envParticles;
    ambientParticles.forEach(p => {
        p.y += p.speedY;
        if (p.y < 0) p.y = CANVAS_HEIGHT;
        ctx.globalAlpha = p.opacity;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1.0;

    // Arena Floor
    ctx.fillStyle = "#121214";
    ctx.fillRect(0, CANVAS_HEIGHT - 60, CANVAS_WIDTH, 60);

    // Hazard Level Floor Trim
    ctx.fillStyle = currentLevelConfig.accent;
    ctx.fillRect(0, CANVAS_HEIGHT - 60, CANVAS_WIDTH, 4);
}

function updateUI() {
    const playerHpPct = Math.max(0, (player.hp / player.maxHp) * 100);
    document.getElementById('player-health').style.width = playerHpPct + '%';

    const bossHpPct = Math.max(0, (boss.hp / boss.maxHp) * 100);
    document.getElementById('boss-health').style.width = bossHpPct + '%';
}

function gameLoop() {
    renderEnvironment();

    // Player Update
    player.update();
    player.draw();

    // Boss Update
    if (boss.hp > 0) {
        boss.update(player);
        boss.draw();

        // Player attacks boss
        if (player.isAttacking && checkAABB(player.attackBox, boss)) {
            boss.hp -= 3;
            if (boss.hp <= 0) {
                if (currentLevelIdx < LEVELS.length - 1) {
                    loadLevel(currentLevelIdx + 1);
                } else {
                    alert("VICTORY! You have conquered all 5 Jurassic Bosses!");
                    loadLevel(0);
                }
            }
        }

        // Boss damages player
        if (checkAABB(player, boss)) {
            player.hp -= 0.6;
        }
    }

    // Hazard Updates
    for (let i = hazards.length - 1; i >= 0; i--) {
        const h = hazards[i];
        h.update();
        h.draw();

        if (h.active && checkCircleRect(h, player)) {
            player.hp -= 12;
            h.active = false;
        }

        if (!h.active) {
            hazards.splice(i, 1);
        }
    }

    updateUI();

    // Defeat Check
    if (player.hp <= 0) {
        alert("Defeated by " + boss.name + "! Restarting Level...");
        player.hp = 100;
        loadLevel(currentLevelIdx);
    }

    requestAnimationFrame(gameLoop);
}

// Initial Boot
loadLevel(0);
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
