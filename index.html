<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Jurassic Rogue: Dino Evolution</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #090a0f;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    #gameContainer {
      position: relative;
      box-shadow: 0 12px 40px rgba(0,0,0,0.9);
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      background: #11131d;
      display: block;
    }
    #cardOverlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(8, 10, 16, 0.88);
      backdrop-filter: blur(6px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }
    .cards-container {
      display: flex;
      gap: 12px;
      margin-top: 15px;
      width: 100%;
      max-width: 720px;
    }
    .card {
      flex: 1;
      background: #1b1e2e;
      border: 2px solid #3d4463;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card.common { border-color: #8a99ad; }
    .card.rare { border-color: #00a2ff; background: #122238; }
    .card.legendary { border-color: #ffaa00; background: #332612; }
    .card .rarity {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }
    .card.common .rarity { color: #8a99ad; }
    .card.rare .rarity { color: #00a2ff; }
    .card.legendary .rarity { color: #ffaa00; }
    .card h3 { margin: 4px 0 8px; font-size: 15px; }
    .card p { font-size: 12px; color: #b0b8c4; margin: 0; }
    .instructions {
      margin-top: 10px;
      color: #717d8a;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="320"></canvas>
    
    <div id="cardOverlay">
      <h2 style="margin:0; color:#ffcc00;">JURASSIC MUTATION READY!</h2>
      <p style="margin:4px 0 0; color:#aaa; font-size:13px;">Choose an evolutionary perk</p>
      <div class="cards-container" id="cardsContainer"></div>
    </div>
  </div>

  <div class="instructions">SPACE / TAP to Jump!</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const cardOverlay = document.getElementById('cardOverlay');
const cardsContainer = document.getElementById('cardsContainer');

let lastTime = performance.now();
let distance = 0;
let level = 1;
let currentXP = 0;
let targetXP = 100;
let gameOver = false;
let pausedForUpgrade = false;
let gameSpeed = 320;
let animTime = 0;

const dino = {
  x: 60,
  y: 200,
  width: 50,
  height: 55,
  velocityY: 0,
  gravity: 1650,
  jumpForce: -590,
  grounded: true,
  maxJumps: 1,
  jumpsRemaining: 1,
  shieldCount: 0,
  magnetRadius: 0,
  xpMultiplier: 1.0,
  scoreMultiplier: 1.0,
  hasRoar: false
};

const UPGRADE_POOL = [
  { id: 'jump_boost', name: 'Raptor Tendons', desc: '+15% Jump Height', rarity: 'common', apply: () => dino.jumpForce -= 85 },
  { id: 'xp_boost', name: 'Amber Instinct', desc: '+30% Amber (XP) Value', rarity: 'common', apply: () => dino.xpMultiplier += 0.3 },
  { id: 'score_boost', name: 'Apex Predator', desc: '+25% Score Multiplier', rarity: 'common', apply: () => dino.scoreMultiplier += 0.25 },
  { id: 'double_jump', name: 'Pterosaur Wings', desc: 'Grants +1 Extra Air Jump', rarity: 'rare', apply: () => dino.maxJumps++ },
  { id: 'shield', name: 'Bone Armor', desc: 'Absorbs 1 Collision Hit', rarity: 'rare', apply: () => dino.shieldCount++ },
  { id: 'magnet', name: 'Pheromone Attraction', desc: 'Pulls nearby Amber directly to you', rarity: 'rare', apply: () => dino.magnetRadius += 130 },
  { id: 'roar', name: 'Alpha Roar', desc: 'Destroys obstacles when jumping', rarity: 'legendary', apply: () => dino.hasRoar = true },
  { id: 'aegis', name: 'Ancient Vitality', desc: 'Gain +2 Bone Shields & +50% XP', rarity: 'legendary', apply: () => { dino.shieldCount += 2; dino.xpMultiplier += 0.5; } }
];

const obstacles = [];
const xpOrbs = [];
const particles = [];

function spawnObstacle() {
  const isAir = Math.random() > 0.65 && level >= 2;
  const height = isAir ? 35 : (35 + Math.random() * 25);
  obstacles.push({
    x: canvas.width + 50,
    y: isAir ? (120 + Math.random() * 50) : (255 - height),
    width: isAir ? 45 : 30,
    height: height,
    type: isAir ? 'PTERODACTYL' : 'CACTUS',
    active: true
  });
}

function spawnXPOrb() {
  xpOrbs.push({
    x: canvas.width + 50,
    y: 110 + Math.random() * 110,
    size: 10,
    value: 25,
    active: true
  });
}

function createParticles(x, y, color, count = 6) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 200,
      vy: (Math.random() - 0.8) * 200,
      size: 2 + Math.random() * 4,
      color,
      life: 0.4 + Math.random() * 0.3
    });
  }
}

let obstacleTimer = 0;
let orbTimer = 0;

function triggerJump() {
  if (pausedForUpgrade) return;
  if (gameOver) { restartGame(); return; }

  if (dino.grounded || dino.jumpsRemaining > 0) {
    if (dino.grounded && dino.hasRoar) {
      obstacles.forEach(obs => {
        obs.active = false;
        createParticles(obs.x, obs.y, '#ff4757', 10);
      });
    }

    dino.velocityY = dino.jumpForce;
    dino.grounded = false;
    dino.jumpsRemaining--;
    createParticles(dino.x + 10, dino.y + dino.height, '#b09060', 8);
  }
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    triggerJump();
  }
});
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  triggerJump();
}, { passive: false });

function restartGame() {
  distance = 0;
  level = 1;
  currentXP = 0;
  targetXP = 100;
  gameSpeed = 320;
  obstacles.length = 0;
  xpOrbs.length = 0;
  particles.length = 0;
  
  dino.y = 200;
  dino.velocityY = 0;
  dino.jumpForce = -590;
  dino.maxJumps = 1;
  dino.shieldCount = 0;
  dino.magnetRadius = 0;
  dino.xpMultiplier = 1.0;
  dino.scoreMultiplier = 1.0;
  dino.hasRoar = false;
  
  gameOver = false;
  pausedForUpgrade = false;
  cardOverlay.style.display = 'none';
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function addXP(amount) {
  currentXP += amount * dino.xpMultiplier;
  if (currentXP >= targetXP) {
    currentXP -= targetXP;
    level++;
    targetXP = Math.floor(targetXP * 1.45);
    triggerLevelUp();
  }
}

function triggerLevelUp() {
  pausedForUpgrade = true;
  cardsContainer.innerHTML = '';

  const choices = [];
  const poolCopy = [...UPGRADE_POOL];

  while (choices.length < 3 && poolCopy.length > 0) {
    const roll = Math.random();
    let targetRarity = 'common';
    if (roll > 0.94) targetRarity = 'legendary';
    else if (roll > 0.68) targetRarity = 'rare';

    let eligible = poolCopy.filter(u => u.rarity === targetRarity);
    if (eligible.length === 0) eligible = poolCopy;

    const index = Math.floor(Math.random() * eligible.length);
    const selected = eligible[index];

    choices.push(selected);
    poolCopy.splice(poolCopy.indexOf(selected), 1);
  }

  choices.forEach(upgrade => {
    const card = document.createElement('div');
    card.className = `card ${upgrade.rarity}`;
    card.innerHTML = `
      <div>
        <div class="rarity">${upgrade.rarity}</div>
        <h3>${upgrade.name}</h3>
      </div>
      <p>${upgrade.desc}</p>
    `;
    card.onclick = () => selectUpgrade(upgrade);
    cardsContainer.appendChild(card);
  });

  cardOverlay.style.display = 'flex';
}

function selectUpgrade(upgrade) {
  upgrade.apply();
  cardOverlay.style.display = 'none';
  pausedForUpgrade = false;
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function gameLoop(now) {
  if (gameOver || pausedForUpgrade) return;

  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  animTime += dt;

  update(dt);
  render();

  requestAnimationFrame(gameLoop);
}

function update(dt) {
  distance += gameSpeed * dt * 0.1 * dino.scoreMultiplier;
  gameSpeed += dt * 3.5;

  dino.velocityY += dino.gravity * dt;
  dino.y += dino.velocityY * dt;

  if (dino.y >= 200) {
    dino.y = 200;
    dino.velocityY = 0;
    dino.grounded = true;
    dino.jumpsRemaining = dino.maxJumps;
  }

  obstacleTimer += dt;
  if (obstacleTimer > (2.1 / (gameSpeed / 300)) + Math.random() * 0.4) {
    spawnObstacle();
    obstacleTimer = 0;
  }

  orbTimer += dt;
  if (orbTimer > 1.6) {
    spawnXPOrb();
    orbTimer = 0;
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    let obs = obstacles[i];
    obs.x -= gameSpeed * dt;

    if (
      dino.x < obs.x + obs.width &&
      dino.x + dino.width > obs.x &&
      dino.y < obs.y + obs.height &&
      dino.y + dino.height > obs.y
    ) {
      if (dino.shieldCount > 0) {
        dino.shieldCount--;
        obs.active = false;
        createParticles(obs.x, obs.y, '#ffd700', 12);
      } else {
        triggerGameOver();
      }
    }

    if (obs.x < -60 || !obs.active) obstacles.splice(i, 1);
  }

  for (let i = xpOrbs.length - 1; i >= 0; i--) {
    let orb = xpOrbs[i];
    orb.x -= gameSpeed * dt;

    if (dino.magnetRadius > 0) {
      const dx = (dino.x + dino.width / 2) - orb.x;
      const dy = (dino.y + dino.height / 2) - orb.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < dino.magnetRadius) {
        orb.x += (dx / dist) * 450 * dt;
        orb.y += (dy / dist) * 450 * dt;
      }
    }

    if (
      dino.x < orb.x + orb.size &&
      dino.x + dino.width > orb.x &&
      dino.y < orb.y + orb.size &&
      dino.y + dino.height > orb.y
    ) {
      addXP(orb.value);
      createParticles(orb.x, orb.y, '#ffaa00', 8);
      xpOrbs.splice(i, 1);
    } else if (orb.x < -50) {
      xpOrbs.splice(i, 1);
    }
  }
}

function triggerGameOver() {
  gameOver = true;
  ctx.fillStyle = 'rgba(5,5,8,0.85)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = '#ff4757';
  ctx.font = 'bold 32px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('EXTINCTION LEVEL EVENT', canvas.width / 2, canvas.height / 2 - 20);
  
  ctx.fillStyle = '#e0e0e0';
  ctx.font = '16px sans-serif';
  ctx.fillText(`Distance: ${Math.floor(distance)}m  |  Evolution Level: ${level}`, canvas.width / 2, canvas.height / 2 + 15);
  ctx.fillText('Press SPACE or TAP to evolve again', canvas.width / 2, canvas.height / 2 + 45);
}

// UNIVERSAL GRAPHICS DRAWING (NO ROUNDRECT DEPENDENCY)
function drawTRex(x, y, w, h) {
  ctx.save();
  ctx.translate(x, y);

  const legShift = dino.grounded ? Math.sin(animTime * 18) * 8 : 4;

  // Body/Torso
  ctx.fillStyle = '#2d6a4f';
  ctx.beginPath();
  ctx.arc(25, 25, 16, 0, Math.PI * 2);
  ctx.fill();

  // Head
  ctx.beginPath();
  ctx.arc(38, 12, 11, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(34, 12, 14, 10);

  // Snout
  ctx.fillStyle = '#ffea00'; // Eye
  ctx.beginPath();
  ctx.arc(42, 8, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Teeth
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(40, 20, 2, 3);
  ctx.fillRect(44, 20, 2, 3);

  // Tail
  ctx.fillStyle = '#2d6a4f';
  ctx.beginPath();
  ctx.moveTo(15, 25);
  ctx.lineTo(-5, 15 + Math.sin(animTime * 10) * 4);
  ctx.lineTo(10, 32);
  ctx.fill();

  // Animated Legs
  ctx.fillStyle = '#1b4332';
  ctx.fillRect(16 + legShift, 38, 6, 16);
  ctx.fillRect(26 - legShift, 38, 6, 16);

  ctx.restore();
}

function drawCactus(x, y, w, h) {
  ctx.fillStyle = '#52b788';
  // Main Stem
  ctx.fillRect(x + w * 0.35, y, w * 0.3, h);
  // Left Arm
  ctx.fillRect(x, y + h * 0.3, w * 0.35, h * 0.15);
  ctx.fillRect(x, y + h * 0.15, w * 0.15, h * 0.3);
  // Right Arm
  ctx.fillRect(x + w * 0.65, y + h * 0.4, w * 0.35, h * 0.15);
  ctx.fillRect(x + w * 0.85, y + h * 0.25, w * 0.15, h * 0.3);
}

function drawPterodactyl(x, y, w, h) {
  ctx.save();
  ctx.translate(x, y);

  const wingY = Math.sin(animTime * 14) * 10;

  ctx.fillStyle = '#b7094c';
  ctx.beginPath();
  ctx.arc(20, 15, 8, 0, Math.PI * 2);
  ctx.fill();

  // Beak
  ctx.beginPath();
  ctx.moveTo(25, 12); ctx.lineTo(40, 16); ctx.lineTo(25, 18);
  ctx.fill();

  // Flapping Wings
  ctx.beginPath();
  ctx.moveTo(15, 15);
  ctx.lineTo(22, 15 + wingY);
  ctx.lineTo(30, 15);
  ctx.fill();

  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background Theme
  ctx.fillStyle = level === 1 ? '#0c1d1a' : (level === 2 ? '#2b1111' : '#0a0d14');
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Ground Line
  ctx.strokeStyle = level === 2 ? '#85331d' : '#406a52';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, 255); ctx.lineTo(canvas.width, 255);
  ctx.stroke();

  // Magnet Aura
  if (dino.magnetRadius > 0) {
    ctx.strokeStyle = 'rgba(255, 220, 0, 0.2)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(dino.x + dino.width/2, dino.y + dino.height/2, dino.magnetRadius, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Draw Entities
  drawTRex(dino.x, dino.y, dino.width, dino.height);

  if (dino.shieldCount > 0) {
    ctx.strokeStyle = '#00a2ff';
    ctx.lineWidth = 2;
    for (let i = 0; i < dino.shieldCount; i++) {
      ctx.strokeRect(dino.x - 4 - (i * 3), dino.y - 4 - (i * 3), dino.width + 8 + (i * 6), dino.height + 8 + (i * 6));
    }
  }

  obstacles.forEach(obs => {
    if (obs.type === 'PTERODACTYL') drawPterodactyl(obs.x, obs.y, obs.width, obs.height);
    else drawCactus(obs.x, obs.y, obs.width, obs.height);
  });

  xpOrbs.forEach(orb => {
    ctx.fillStyle = '#ffaa00';
    ctx.beginPath();
    ctx.arc(orb.x, orb.y, orb.size, 0, Math.PI * 2);
    ctx.fill();
  });

  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });

  // HUD
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`DIST: ${Math.floor(distance)}m`, 20, 26);
  ctx.fillText(`EVO LVL: ${level}`, 160, 26);

  const barWidth = 200;
  const barHeight = 10;
  const xpRatio = Math.min(currentXP / targetXP, 1);

  ctx.fillStyle = '#1b1e2e';
  ctx.fillRect(250, 16, barWidth, barHeight);
  ctx.fillStyle = '#ffaa00';
  ctx.fillRect(250, 16, barWidth * xpRatio, barHeight);
  ctx.strokeStyle = '#ffcc00';
  ctx.lineWidth = 1;
  ctx.strokeRect(250, 16, barWidth, barHeight);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
