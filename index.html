<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jurassic Rampage - Mobile Ready Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #08080c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #game-wrapper {
            position: relative;
            width: 960px;
            height: 540px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 960px;
            height: 540px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 100, 0, 0.2);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #2a2a35;
            background: #000;
            transform-origin: center center;
        }
        canvas {
            display: block;
            width: 960px;
            height: 540px;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            gap: 12px;
        }
        .hud-card {
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 12px;
            border-radius: 6px;
            min-width: 200px;
            pointer-events: auto;
        }
        .bar-container {
            width: 100%;
            height: 14px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #444;
            border-radius: 3px;
            padding: 2px;
            margin-top: 4px;
            position: relative;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.1s linear;
        }
        #player-health { background: linear-gradient(90deg, #ff5252, #4caf50); }
        #boss-health { background: linear-gradient(90deg, #ff9800, #f44336); width: 100%; }
        .boss-hud {
            width: 40%;
            margin: 0 auto;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .boss-hud.active {
            opacity: 1;
        }
        .boss-title {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ff5722;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }
        #level-title {
            font-size: 13px;
            color: #ffca28;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        #distance-hud {
            font-size: 12px;
            color: #00e676;
            font-weight: bold;
            margin-top: 4px;
        }
        .btn-fullscreen {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 10;
        }
        .btn-fullscreen:active {
            background: rgba(255, 255, 255, 0.3);
        }
        /* Mobile Touch Controls Layer */
        #touch-controls {
            position: absolute;
            bottom: 12px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: auto;
        }
        .touch-group {
            display: flex;
            gap: 10px;
        }
        .touch-btn {
            width: 54px;
            height: 54px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #fff;
            user-select: none;
        }
        .touch-btn:active {
            background: rgba(255, 255, 255, 0.4);
        }
        @media (min-width: 1024px) {
            #touch-controls {
                display: none;
            }
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="game-container">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
        <div id="ui-overlay">
            <button id="fullscreen-btn" class="btn-fullscreen">Fullscreen</button>
            
            <div class="hud-top">
                <div class="hud-card">
                    <div style="font-size: 10px; font-weight: bold; color: #aaa; letter-spacing: 1px;">HUNTER STATUS</div>
                    <div class="bar-container">
                        <div id="player-health" class="bar-fill" style="width: 100%;"></div>
                    </div>
                    <div id="level-title" style="margin-top: 4px;">Level 11: Amber Ridge & The Glass Peaks</div>
                    <div id="distance-hud">DISTANCE TO BOSS: 1000m</div>
                </div>
                
                <div id="boss-hud" class="boss-hud hud-card">
                    <div id="boss-name" class="boss-title">AMBER-CLAWED THERIZINOSAURUS</div>
                    <div class="bar-container">
                        <div id="boss-health" class="bar-fill"></div>
                    </div>
                </div>
            </div>

            <!-- On-Screen Controls for Mobile / Touch -->
            <div id="touch-controls">
                <div class="touch-group">
                    <div class="touch-btn" id="btn-left">◄</div>
                    <div class="touch-btn" id="btn-right">►</div>
                </div>
                <div class="touch-group">
                    <div class="touch-btn" id="btn-jump">▲</div>
                    <div class="touch-btn" style="background: rgba(255, 87, 34, 0.4);" id="btn-attack">⚔</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * Jurassic Rampage Engine - Responsive & Runner Integrated
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');

const GRAVITY = 0.55;
const CANVAS_WIDTH = 960;
const CANVAS_HEIGHT = 540;

// Auto Screen Scaler for Mobile/Desktops
function resizeGame() {
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    const scale = Math.min(windowWidth / CANVAS_WIDTH, windowHeight / CANVAS_HEIGHT);
    container.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', resizeGame);
window.addEventListener('load', resizeGame);

// Fullscreen Handler
document.getElementById('fullscreen-btn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
    }
});

// Input State
const keys = { a: false, d: false, w: false, space: false, attack: false };

window.addEventListener('keydown', (e) => {
    if (e.key === 'a' || e.key === 'A') keys.a = true;
    if (e.key === 'd' || e.key === 'D') keys.d = true;
    if (e.key === 'w' || e.key === 'W') keys.w = true;
    if (e.key === ' ') keys.space = true;
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'a' || e.key === 'A') keys.a = false;
    if (e.key === 'd' || e.key === 'D') keys.d = false;
    if (e.key === 'w' || e.key === 'W') keys.w = false;
    if (e.key === ' ') keys.space = false;
});

canvas.addEventListener('mousedown', (e) => { if (e.button === 0) keys.attack = true; });
canvas.addEventListener('mouseup', (e) => { if (e.button === 0) keys.attack = false; });

// Mobile Touch Control Bindings
const bindTouch = (id, keyName) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
    el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
};
bindTouch('btn-left', 'a');
bindTouch('btn-right', 'd');
bindTouch('btn-jump', 'w');
bindTouch('btn-attack', 'attack');

// Level Configurations
const LEVELS = [
    {
        id: 11,
        name: "Level 11: Amber Ridge & Glass Peaks",
        bgTop: "#1c1200",
        bgBottom: "#4d3000",
        accent: "#ffb300",
        bossName: "Amber-Clawed Therizinosaurus",
        bossColor: "#ff8f00",
        hazardType: "amber_shard",
        envParticles: "#ffc107"
    },
    {
        id: 12,
        name: "Level 12: Ash & Sulphur Tar Pits",
        bgTop: "#0f0808",
        bgBottom: "#2d1508",
        accent: "#ff3d00",
        bossName: "Magma-Bred Ankylosaurus",
        bossColor: "#d84315",
        hazardType: "tar_bubble",
        envParticles: "#ff5722"
    },
    {
        id: 13,
        name: "Level 13: Titan Redwood Canopy",
        bgTop: "#0a1128",
        bgBottom: "#1c2541",
        accent: "#00e676",
        bossName: "Tempest Quetzalcoatlus",
        bossColor: "#0288d1",
        hazardType: "wind_gust",
        envParticles: "#80d8ff"
    },
    {
        id: 14,
        name: "Level 14: Abyssal Cenote",
        bgTop: "#02010a",
        bgBottom: "#041f3d",
        accent: "#00f5d4",
        bossName: "Depth-Crawler Mosasaurus",
        bossColor: "#0096c7",
        hazardType: "spore",
        envParticles: "#70e000"
    },
    {
        id: 15,
        name: "Level 15: The Supervolcano Caldera",
        bgTop: "#2b0000",
        bgBottom: "#660000",
        accent: "#ff1744",
        bossName: "Apex Shadow Tyranus",
        bossColor: "#212121",
        hazardType: "falling_rock",
        envParticles: "#ff1744"
    }
];

let currentLevelIdx = 0;
let ambientParticles = [];
let gamePhase = 'RUNNER'; // 'RUNNER' or 'BOSS'
let distanceToBoss = 1000;
let runnerSpeed = 6;

// Player Entity
class Player {
    constructor() {
        this.x = 100;
        this.y = 300;
        this.width = 34;
        this.height = 52;
        this.vx = 0;
        this.vy = 0;
        this.speed = 5.5;
        this.jumpStrength = -12.5;
        this.grounded = false;
        this.hp = 100;
        this.maxHp = 100;
        this.isAttacking = false;
        this.attackCooldown = 0;
        this.attackBox = { x: 0, y: 0, width: 50, height: 52 };
        this.facing = 'right';
    }

    update() {
        if (keys.a) {
            this.vx = -this.speed;
            this.facing = 'left';
        } else if (keys.d) {
            this.vx = this.speed;
            this.facing = 'right';
        } else {
            this.vx *= 0.8;
        }

        if ((keys.w || keys.space) && this.grounded) {
            this.vy = this.jumpStrength;
            this.grounded = false;
        }

        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;

        // Ground collision
        if (this.y + this.height >= CANVAS_HEIGHT - 60) {
            this.y = CANVAS_HEIGHT - 60 - this.height;
            this.vy = 0;
            this.grounded = true;
        }

        // Boundaries
        if (this.x < 0) this.x = 0;
        if (this.x + this.width > CANVAS_WIDTH) this.x = CANVAS_WIDTH - this.width;

        // Attack Logic
        if (this.attackCooldown > 0) this.attackCooldown--;

        if (keys.attack && this.attackCooldown === 0) {
            this.isAttacking = true;
            this.attackCooldown = 18;
            setTimeout(() => { this.isAttacking = false; }, 140);
        }

        this.attackBox.x = this.facing === 'right' ? this.x + this.width : this.x - this.attackBox.width;
        this.attackBox.y = this.y;
    }

    draw() {
        ctx.fillStyle = "#4caf50";
        ctx.fillRect(this.x, this.y, this.width, this.height);

        ctx.fillStyle = "#2e7d32";
        ctx.fillRect(this.x + 4, this.y + 12, this.width - 8, this.height - 24);

        ctx.fillStyle = "#ffffff";
        const eyeX = this.facing === 'right' ? this.x + 22 : this.x + 4;
        ctx.fillRect(eyeX, this.y + 10, 8, 6);

        if (this.isAttacking) {
            ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
            ctx.fillRect(this.attackBox.x, this.attackBox.y, this.attackBox.width, this.attackBox.height);
        }
    }
}

// Boss Entity
class Boss {
    constructor(config) {
        this.x = CANVAS_WIDTH + 100; // Starts offscreen
        this.y = CANVAS_HEIGHT - 220;
        this.width = 140;
        this.height = 160;
        this.hp = 600;
        this.maxHp = 600;
        this.color = config.bossColor;
        this.name = config.bossName;
        this.phase = 1;
        this.attackTimer = 0;
        this.vx = 0;
    }

    update(player) {
        if (this.x > CANVAS_WIDTH - 200) {
            this.x -= 3; // Entrance animation
            return;
        }

        this.attackTimer++;
        if (this.hp < this.maxHp * 0.5 && this.phase === 1) {
            this.phase = 2;
        }

        const attackInterval = this.phase === 2 ? 80 : 120;
        if (this.attackTimer % attackInterval === 0) {
            this.executePattern(player);
        }

        this.x += this.vx;
        this.vx *= 0.88;

        if (this.x < 320) this.x = 320;
        if (this.x + this.width > CANVAS_WIDTH - 20) this.x = CANVAS_WIDTH - 20 - this.width;
    }

    executePattern(player) {
        const rand = Math.random();
        if (rand < 0.5) {
            const dir = player.x < this.x ? -1 : 1;
            this.vx = dir * (this.phase === 2 ? 14 : 9);
        } else {
            spawnHazard(this.x + this.width / 2, this.y + 20);
            if (this.phase === 2) {
                spawnHazard(this.x, this.y + 20);
            }
        }
    }

    draw() {
        ctx.fillStyle = this.phase === 2 ? "#d50000" : this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(this.x - 10, this.y + 40, 15, 8);
        ctx.fillRect(this.x - 10, this.y + 70, 15, 8);

        ctx.fillStyle = this.phase === 2 ? "#ffff00" : "#ff5252";
        ctx.fillRect(this.x + 20, this.y + 25, 18, 14);

        if (this.phase === 2) {
            ctx.strokeStyle = "rgba(255, 23, 68, 0.6)";
            ctx.lineWidth = 6;
            ctx.strokeRect(this.x - 6, this.y - 6, this.width + 12, this.height + 12);
        }
    }
}

// Environmental Hazards / Runner Obstacles
class Hazard {
    constructor(x, y, type, color, isRunnerObstacle = false) {
        this.x = x;
        this.y = y;
        this.radius = 16;
        this.vx = isRunnerObstacle ? -runnerSpeed : (Math.random() - 0.5) * 7;
        this.vy = isRunnerObstacle ? 0 : -7;
        this.color = color;
        this.type = type;
        this.active = true;
        this.isRunnerObstacle = isRunnerObstacle;
    }

    update() {
        if (!this.isRunnerObstacle) {
            this.vy += GRAVITY * 0.45;
        }
        this.x += this.vx;
        this.y += this.vy;

        if (this.y >= CANVAS_HEIGHT - 60 && !this.isRunnerObstacle) {
            this.active = false;
        }
        if (this.x < -40) {
            this.active = false;
        }
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.closePath();
    }
}

// Global Objects
const player = new Player();
let currentLevelConfig = LEVELS[currentLevelIdx];
let boss = new Boss(currentLevelConfig);
let hazards = [];

function spawnHazard(x, y, isRunner = false) {
    hazards.push(new Hazard(x, y, currentLevelConfig.hazardType, currentLevelConfig.accent, isRunner));
}

function initAmbientParticles() {
    ambientParticles = [];
    for (let i = 0; i < 35; i++) {
        ambientParticles.push({
            x: Math.random() * CANVAS_WIDTH,
            y: Math.random() * CANVAS_HEIGHT,
            size: Math.random() * 3 + 1,
            speedY: -(Math.random() * 1.5 + 0.5),
            opacity: Math.random()
        });
    }
}

function loadLevel(index) {
    currentLevelIdx = index;
    currentLevelConfig = LEVELS[currentLevelIdx];

    document.getElementById('level-title').innerText = currentLevelConfig.name;
    document.getElementById('boss-name').innerText = currentLevelConfig.bossName;
    document.getElementById('boss-hud').classList.remove('active');

    gamePhase = 'RUNNER';
    distanceToBoss = 1000;
    
    boss = new Boss(currentLevelConfig);
    hazards = [];
    player.x = 100;
    player.hp = 100;
    initAmbientParticles();
}

function checkAABB(rect1, rect2) {
    return (
        rect1.x < rect2.x + rect2.width &&
        rect1.x + rect1.width > rect2.x &&
        rect1.y < rect2.y + rect2.height &&
        rect1.y + rect1.height > rect2.y
    );
}

function checkCircleRect(circle, rect) {
    let distX = Math.abs(circle.x - rect.x - rect.width / 2);
    let distY = Math.abs(circle.y - rect.y - rect.height / 2);

    if (distX > (rect.width / 2 + circle.radius)) return false;
    if (distY > (rect.height / 2 + circle.radius)) return false;

    if (distX <= (rect.width / 2)) return true;
    if (distY <= (rect.height / 2)) return true;

    let dx = distX - rect.width / 2;
    let dy = distY - rect.height / 2;
    return (dx * dx + dy * dy <= (circle.radius * circle.radius));
}

function renderEnvironment() {
    let gradient = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
    gradient.addColorStop(0, currentLevelConfig.bgTop);
    gradient.addColorStop(1, currentLevelConfig.bgBottom);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // Ambient Floating Particles
    ctx.fillStyle = currentLevelConfig.envParticles;
    ambientParticles.forEach(p => {
        if (gamePhase === 'RUNNER') p.x -= 2;
        p.y += p.speedY;
        if (p.x < 0) p.x = CANVAS_WIDTH;
        if (p.y < 0) p.y = CANVAS_HEIGHT;
        ctx.globalAlpha = p.opacity;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1.0;

    // Arena Floor
    ctx.fillStyle = "#121214";
    ctx.fillRect(0, CANVAS_HEIGHT - 60, CANVAS_WIDTH, 60);

    ctx.fillStyle = currentLevelConfig.accent;
    ctx.fillRect(0, CANVAS_HEIGHT - 60, CANVAS_WIDTH, 4);
}

function updateUI() {
    const playerHpPct = Math.max(0, (player.hp / player.maxHp) * 100);
    document.getElementById('player-health').style.width = playerHpPct + '%';

    const bossHpPct = Math.max(0, (boss.hp / boss.maxHp) * 100);
    document.getElementById('boss-health').style.width = bossHpPct + '%';

    if (gamePhase === 'RUNNER') {
        document.getElementById('distance-hud').innerText = `DISTANCE TO BOSS: ${Math.max(0, Math.floor(distanceToBoss))}m`;
    } else {
        document.getElementById('distance-hud').innerText = `BOSS ENGAGED!`;
    }
}

function gameLoop() {
    renderEnvironment();

    // Player Logic
    player.update();
    player.draw();

    // Game Phase Handling
    if (gamePhase === 'RUNNER') {
        distanceToBoss -= 1.5;

        // Spawn runner obstacles
        if (Math.random() < 0.035) {
            const isHigh = Math.random() > 0.6;
            const obsY = isHigh ? CANVAS_HEIGHT - 130 : CANVAS_HEIGHT - 75;
            spawnHazard(CANVAS_WIDTH + 40, obsY, true);
        }

        if (distanceToBoss <= 0) {
            gamePhase = 'BOSS';
            document.getElementById('boss-hud').classList.add('active');
            hazards = [];
        }
    } else if (gamePhase === 'BOSS') {
        if (boss.hp > 0) {
            boss.update(player);
            boss.draw();

            // Player attacks boss
            if (player.isAttacking && checkAABB(player.attackBox, boss)) {
                boss.hp -= 3;
                if (boss.hp <= 0) {
                    if (currentLevelIdx < LEVELS.length - 1) {
                        alert("LEVEL CLEARED! Advancing to next zone...");
                        loadLevel(currentLevelIdx + 1);
                    } else {
                        alert("VICTORY! You have conquered all 5 Jurassic Bosses!");
                        loadLevel(0);
                    }
                }
            }

            // Boss damages player
            if (checkAABB(player, boss)) {
                player.hp -= 0.6;
            }
        }
    }

    // Hazard Updates & Collisions
    for (let i = hazards.length - 1; i >= 0; i--) {
        const h = hazards[i];
        h.update();
        h.draw();

        if (h.active && checkCircleRect(h, player)) {
            player.hp -= 12;
            h.active = false;
        }

        if (!h.active) {
            hazards.splice(i, 1);
        }
    }

    updateUI();

    // Defeat Check
    if (player.hp <= 0) {
        alert("Defeated! Restarting Level...");
        loadLevel(currentLevelIdx);
    }

    requestAnimationFrame(gameLoop);
}

// Initial Boot
loadLevel(0);
resizeGame();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
